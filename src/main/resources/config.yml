# 死亡惩罚配置
death_penalty:
  percent: 0.05    # 扣除当前分数的百分比（5%）
  max: 3.0         # 单次扣除上限分数

# 阈值命令：分数第一次达到 score 时执行一次（触发记录持久化在 data.yml，不会被 recalc 清掉）
# 段位奖励已经内置在 ranks.yml 里，这里留空即可；需要额外的“分数到了就执行某条命令”时可以按下面的格式添加：
#   - score: 100
#     command: 'say %player% 拿到了 100 分！'
#     console: true      # true = 控制台执行；false = 玩家自己执行
thresholds: []

pvp:
  kill_cooldown_seconds: 300   # 击杀同一玩家的冷却时间（秒），冷却期内不给分

