# 死亡惩罚配置
death_penalty:
  percent: 0.05    # 扣除当前分数的百分比（5%）
  max: 3.0         # 单次扣除上限分数

# 阈值命令：分数达到 score 时执行一次（触发记录持久化在 data.yml 的 triggered 里，不会被 recalc 清掉）
