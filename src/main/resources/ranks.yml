# 段位定义：列表顺序即段位从低到高，score = 晋升到该段位所需的生存段位分。
# display 支持三种写法：
#   &a &l 等传统颜色/格式代码
#   {#RRGGBB}                   单色
#   {#RRGGBB>}文字{#RRGGBB<}     渐变（从 > 的颜色渐变到 < 的颜色）
#   {#RRGGBB<>}                 渐变中间的色标（可多个）
# auto: false 表示该段位不能自动升级，必须手动 /srank rankup（默认 true）
# money: 晋升奖励金币（可省略）

settings:
  # 新玩家默认是否开启自动升级（玩家可用 /srank autorankup 自己切换）
  auto-rankup-default: true
  # 自动升级检查周期（秒）
  check-interval-seconds: 60
  money:
    # 有 Vault 经济时直接走 Vault；否则执行下面的命令（%player% 玩家名，%amount% 金额），留空则不发放
    command: 'cmi money give %player% %amount%'
  messages:
    broadcast: '&a玩家&e %player% &6升级到了 %rank%'
    title: '&a生存&6段位&e升级！'
    subtitle: '&d你提升到了 %rank%!'
    chat:
      - '&e--------------------'
      - '&a生存段位提升! Rank Up!'
      - '&d恭喜你升级到了 %rank%'
      - '&f'
      - '&e+%money% 金币'
      - '&e--------------------'
    sound: BLOCK_BEACON_POWER_SELECT
    volume: 1.0
    pitch: 1.1

